name: Deploy Microservices to ECS Service

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: microservices

  ECS_SERVICE1: authservice-service-mggrkb58
  ECS_SERVICE2: cartservice-service-2dqnwwi2
  ECS_SERVICE3: productservice-service-60qkn6l0

jobs:

  deploy:

    name: Deploy Microservices to ECS

    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------
      # Verify AWS Authentication
      # ---------------------------------------
      - name: Verify AWS identity
        run: |
          echo "Checking AWS identity..."
          aws sts get-caller-identity

      # ---------------------------------------
      # Verify ECS Cluster
      # ---------------------------------------
      - name: Verify ECS cluster
        run: |
          echo "Checking ECS cluster..."

          aws ecs describe-clusters \
            --clusters "${ECS_CLUSTER}" \
            --region "${AWS_REGION}"

      # ---------------------------------------
      # Deploy Auth Service
      # ---------------------------------------
      - name: Deploy Auth Service
        run: |
          echo "Deploying Auth Service..."

          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE1}" \
            --force-new-deployment \
            --region "${AWS_REGION}"

      # ---------------------------------------
      # Deploy Cart Service
      # ---------------------------------------
      - name: Deploy Cart Service
        run: |
          echo "Deploying Cart Service..."

          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE2}" \
            --force-new-deployment \
            --region "${AWS_REGION}"

      # ---------------------------------------
      # Deploy Product Service
      # ---------------------------------------
      - name: Deploy Product Service
        run: |
          echo "Deploying Product Service..."

          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE3}" \
            --force-new-deployment \
            --region "${AWS_REGION}"

      # ---------------------------------------
      # Wait for Auth Service
      # ---------------------------------------
      - name: Wait for Auth Service
        run: |
          echo "Waiting for Auth Service..."

          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE1}" \
            --region "${AWS_REGION}"

      # ---------------------------------------
      # Wait for Cart Service
      # ---------------------------------------
      - name: Wait for Cart Service
        run: |
          echo "Waiting for Cart Service..."

          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE2}" \
            --region "${AWS_REGION}"

      # ---------------------------------------
      # Wait for Product Service
      # ---------------------------------------
      - name: Wait for Product Service
        run: |
          echo "Waiting for Product Service..."

          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE3}" \
            --region "${AWS_REGION}"

      # ---------------------------------------
      # Final Status
      # ---------------------------------------
      - name: Final ECS deployment status
        run: |
          echo "======================================"
          echo "ECS Deployment Completed"
          echo "======================================"

          aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services \
              "${ECS_SERVICE1}" \
              "${ECS_SERVICE2}" \
              "${ECS_SERVICE3}" \
            --region "${AWS_REGION}" \
            --query 'services[].{Service:serviceName,Status:status,Running:runningCount,Desired:desiredCount,TaskDefinition:taskDefinition}' \
            --output table
